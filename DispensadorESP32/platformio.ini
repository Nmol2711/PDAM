; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^6.21.6
    bogde/HX711 @ ^0.7.5

monitor_speed = 115200
; La suite nativa no aplica al objetivo ESP32 (requiere hardware para WiFi/BLE).
test_ignore = test_provisioning_utils, test_dispensing_utils, test_dispensing_cycle, test_report_utils, test_scale_guard_utils

; Entorno de pruebas unitarias de logica pura (sin hardware ni Arduino).
; Ejecutar con: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -I$PROJECT_DIR/src
test_build_src = no
build_src_filter = -<*>
